name: Actualizar precios de renting

on:
  schedule:
    # Cada día a las 8:00h hora España (6 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Scrapear gestoras (genera ofertas-db.json)
        # El scraper captura errores por gestora y sale 0 aunque alguna falle.
        continue-on-error: true
        run: python scrape_myrenting.py

      - name: Inyectar de forma segura (guardarrailes + rollback)
        # Si el scrape esta roto, este paso ABORTA (exit!=0) y el workflow
        # no llega a commitear: la web queda intacta.
        run: python actualizar_ofertas_seguro.py

      - name: Verificar cambios
        id: changes
        run: |
          git diff --quiet index.html ofertas-manuales.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit y push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'Myrenting Bot'
          git config user.email 'bot@myrenting.es'
          git add index.html ofertas-manuales.json
          git commit -m "Actualizar precios $(date +'%Y-%m-%d')"
          git push origin HEAD

      - name: Resumen
        if: always()
        run: |
          echo "## Actualizacion de precios" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date +'%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "- Cambios: ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
