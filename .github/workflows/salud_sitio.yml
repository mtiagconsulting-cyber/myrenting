name: Salud del sitio

on:
  workflow_dispatch:  # Solo se lanza manualmente desde GitHub Actions

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Auditar sitio
        run: python3 scripts/mantenimiento/salud_sitio.py
